<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 480" width="400" height="480">
  <title>Homoeopathic medicine bottles on a clinic shelf</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#effaf6"/>
      <stop offset="1" stop-color="#d8f2e9"/>
    </linearGradient>
    <!-- Amber dropper bottle; origin = bottom centre -->
    <g id="bottle">
      <path d="M-7-86a7 9 0 0 1 14 0v12H-7Z" fill="#2a9880"/>
      <rect x="-10" y="-74" width="20" height="9" rx="2" fill="#1d7a68"/>
      <rect x="-6" y="-65" width="12" height="9" fill="#c58a33"/>
      <rect x="-20" y="-56" width="40" height="56" rx="9" fill="#dba552"/>
      <rect x="-13" y="-40" width="26" height="22" rx="3" fill="#fffaf0" opacity=".85"/>
      <path d="M-7-32h14M-7-25h9" stroke="#80cfb9" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M-14-50v42" stroke="#fff" stroke-opacity=".5" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="pill"><circle r="6" fill="#fff"/><circle r="5.6" fill="none" stroke="#a9dccb" stroke-width="1.2"/></g>
    <path id="leaf" d="M0 0C14-24 46-33 72-25 56 0 25 11 0 0Z" fill="#4cb39a"/>
  </defs>

  <rect width="400" height="480" rx="24" fill="url(#bg)"/>
  <circle cx="320" cy="80" r="70" fill="#c6eadd" opacity=".6"/>
  <circle cx="70" cy="420" r="80" fill="#c6eadd" opacity=".5"/>

  <!-- Upper shelf -->
  <rect x="36" y="196" width="328" height="12" rx="6" fill="#2a9880"/>
  <rect x="48" y="208" width="10" height="16" rx="3" fill="#1d7a68"/>
  <rect x="342" y="208" width="10" height="16" rx="3" fill="#1d7a68"/>
  <use href="#bottle" xlink:href="#bottle" transform="translate(84 196)"/>
  <use href="#bottle" xlink:href="#bottle" transform="translate(136 196) scale(.82)"/>
  <use href="#bottle" xlink:href="#bottle" transform="translate(182 196) scale(1.1)"/>
  <!-- Globule jar -->
  <g transform="translate(250 196)">
    <rect x="-30" y="-74" width="60" height="74" rx="12" fill="#ffffff" fill-opacity=".75" stroke="#80cfb9" stroke-width="3"/>
    <rect x="-34" y="-86" width="68" height="14" rx="5" fill="#2a9880"/>
    <use href="#pill" xlink:href="#pill" x="-14" y="-12"/>
    <use href="#pill" xlink:href="#pill" x="0" y="-12"/>
    <use href="#pill" xlink:href="#pill" x="14" y="-12"/>
    <use href="#pill" xlink:href="#pill" x="-7" y="-24"/>
    <use href="#pill" xlink:href="#pill" x="7" y="-24"/>
    <use href="#pill" xlink:href="#pill" x="-14" y="-36"/>
    <use href="#pill" xlink:href="#pill" x="0" y="-36"/>
    <use href="#pill" xlink:href="#pill" x="14" y="-36"/>
  </g>
  <use href="#bottle" xlink:href="#bottle" transform="translate(320 196) scale(.75)"/>

  <!-- Lower shelf -->
  <rect x="36" y="356" width="328" height="12" rx="6" fill="#2a9880"/>
  <rect x="48" y="368" width="10" height="16" rx="3" fill="#1d7a68"/>
  <rect x="342" y="368" width="10" height="16" rx="3" fill="#1d7a68"/>
  <!-- Potted plant -->
  <g transform="translate(96 356)">
    <path d="M0-40C-2-70 4-100 12-128" stroke="#174f46" stroke-width="4" fill="none" stroke-linecap="round"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(2 -60) rotate(-40) scale(.75)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(4 -84) scale(-.7 .7) rotate(-25)"/>
    <use href="#leaf" xlink:href="#leaf" transform="translate(10 -118) rotate(-75) scale(.6)"/>
    <path d="M-28-42h56l-8 42h-40Z" fill="#fff" stroke="#174f46" stroke-width="3.5" stroke-linejoin="round"/>
  </g>
  <!-- Mortar and pestle -->
  <g transform="translate(206 356)">
    <path d="M-12-62 14-20" stroke="#c58a33" stroke-width="9" stroke-linecap="round"/>
    <path d="M-40-34h80c0 20-18 34-40 34s-40-14-40-34Z" fill="#fff" stroke="#174f46" stroke-width="3.5" stroke-linejoin="round"/>
    <rect x="-44" y="-40" width="88" height="10" rx="5" fill="#fff" stroke="#174f46" stroke-width="3.5"/>
  </g>
  <use href="#bottle" xlink:href="#bottle" transform="translate(290 356) scale(.9)"/>
  <use href="#bottle" xlink:href="#bottle" transform="translate(332 356) scale(.68)"/>

  <!-- Loose globules -->
  <use href="#pill" xlink:href="#pill" x="250" y="440"/>
  <use href="#pill" xlink:href="#pill" x="266" y="448"/>
  <use href="#pill" xlink:href="#pill" x="236" y="452"/>
</svg>
